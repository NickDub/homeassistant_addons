configuration:
  Screen_Size:
    name: Sélectionnez la taille de l'écran
    description: >-
      Sélectionnez la taille de l'écran de l'affichage OLED. 32x128 ou 64x128.
  Show_Static_Screen:
    name: Afficher l'écran personnalisé
    description: >-
      Affiche l'écran statique avec le texte personnalisé spécifié
  Show_Welcome_Screen:
    name: Afficher l'écran de bienvenue
    description: >-
      Si activé, affiche un écran animé 'Bienvenue à `hostname`'.
  Show_Version_Screen:
    name: Afficher l'écran de démarrage de Home Assistant
    description: >-
      Si activé, affiche la version actuelle de Home Assistant OS et du noyau.
      Un astérisque sera présenté si l'un ou l'autre nécessite une mise à jour.
  Show_Network_Screen:
    name: Afficher l'écran d'informations réseau
    description: >-
      Si activé, affiche l'IP et le nom d'hôte.
  Show_CPU_Screen:
    name: Afficher l'écran des statistiques CPU
    description: >-
      Si activé, affiche les statistiques CPU telles que la température, la charge et le temps de fonctionnement.
  Show_Memory_Screen:
    name: Afficher l'écran d'informations mémoire
    description: >-
      Si activé, affiche les statistiques mémoire, comme la quantité utilisée, totale et l'utilisation.
  Show_Storage_Screen:
    name: Afficher l'écran d'informations stockage
    description: >-
      Si activé, affiche les statistiques de stockage, comme la quantité utilisée, totale et l'utilisation.
  Show_Stats_Screen:
    name: Afficher l'écran des statistiques
    description: >-
      Si activé, affiche toutes les statistiques du système
  icon_stats:
    name: Stats Type
    description: >-
      Show only text or icons on stats screen.

  Welcome_Screen_Text:
    name: Texte de l'écran de bienvenue
    description: >-
      Texte à afficher lorsque l'option Show_Welcome_Screen est activée. Accepte toutes les variables de texte statique.
  Static_Screen_Text:
    name: Texte de l'écran personnalisé
    description: >-
      Texte à afficher lorsque l'option Show_Static_Screen est activée. Accepte toutes les variables de texte statique.
  Graceful_Exit_Text:
    name: Texte d'arrêt du service
    description: >-
      Texte à afficher lors de l'arrêt du service. Accepte les mêmes variables que l'écran personnalisé.

  Default_Duration:
    name: Durée par défaut
    description: >-
      Cette option permet de définir la durée par défaut en secondes d'affichage de chaque écran.
      Cette option est ignorée pour les écrans ayant une durée spécifique.
  Scroll_Amplitude:
    name: Amplitude de hauteur de défilement
    description: >-
      Quantité d'action de vague que l'animation de défilement de texte a. Plus le nombre est grand, plus la vague est grande.
  DateTime_Format:
    name: Format date et heure
    description: >-
      Format de la variable de texte statique {datetime}
  Static_Screen_Text_NoScroll:
    name: Empêcher le défilement de l'écran personnalisé
    description: >-
      Désactive l'animation de défilement si le texte statique est trop grand pour tenir. Si activé, fait un effort pour empiler le texte en lignes centrées.
  Temperature_Unit:
    name: Unité de température
    description: >-
      Affiche la température CPU en C (Celsius) ou F (Fahrenheit).
  Rotate:
    name: Rotation de l'écran
    description: >-
      Nombre de degrés pour faire pivoter l'écran dans le sens antihoraire à partir du centre.
  
  Welcome_Screen_Duration:
    name: Durée de l'écran de bienvenue
    description: >-
      Durée d'affichage de l'écran de bienvenue en secondes.
  Welcome_Screen_Limit:
    name: Limite d'affichage de l'écran de bienvenue
    description: >-
      Nombre de fois que l'écran de bienvenue peut apparaître.
      Par exemple, si défini sur 2, l'écran de bienvenue n'apparaîtra que 2 fois.

  Version_Screen_Duration:
    name: Durée de l'écran de démarrage de Home Assistant
    description: >-
      Durée d'affichage de l'écran de démarrage de Home Assistant en secondes.
  Version_Screen_Limit:
    name: Limite d'affichage de l'écran de démarrage de Home Assistant
    description: >-
      Nombre de fois que l'écran de démarrage de Home Assistant peut apparaître.

    Network_Screen_Duration:
      name: Durée de l'écran réseau
      description: >-
        Durée d'affichage de l'écran réseau en secondes.
    Network_Screen_Limit:
      name: Limite d'affichage de l'écran réseau
      description: >-
        Nombre de fois que l'écran réseau peut apparaître.

    CPU_Screen_Duration:
      name: Durée de l'écran CPU
      description: >-
        Durée d'affichage de l'écran CPU en secondes.
    CPU_Screen_Limit:
      name: Limite d'affichage de l'écran CPU
      description: >-
        Nombre de fois que l'écran CPU peut apparaître.

    Memory_Screen_Duration:
      name: Durée de l'écran mémoire
      description: >-
        Durée d'affichage de l'écran mémoire en secondes.
    Memory_Screen_Limit:
      name: Limite d'affichage de l'écran mémoire
      description: >-
        Nombre de fois que l'écran mémoire peut apparaître.

    Storage_Screen_Duration:
      name: Durée de l'écran stockage
      description: >-
        Durée d'affichage de l'écran stockage en secondes.
    Storage_Screen_Limit:
      name: Limite d'affichage de l'écran stockage
      description: >-
        Nombre de fois que l'écran stockage peut apparaître.

  Stats_Screen_duration:
    name: Durée de l'écran des statistiques
    description: >-
      Durée d'affichage de l'écran des statistiques en secondes.
  Stats_Screen_Limit:
    name: Limite d'affichage de l'écran des statistiques
    description: >-
      Nombre de fois que l'écran des statistiques peut apparaître.

    Debug_Mode:
      name: Mode débogage
      description: >-
        Active le mode débogage en affichant les logs d'information dans le journal de l'addon.
    I2C_bus:
      name: Numéro du bus I2C
      description: >-
        Numéro du bus de votre périphérique I2C.
        Il s'agit généralement de 1 (/dev/i2c-1), mais parfois certains appareils utilisent 0 (/dev/i2c-0).
    Screenshot:
      name: Chemin de capture d'écran
      description: >-
        Capture une capture d'écran de chaque écran dans /media/[screen_name].png.
        Pour vérifier la capture des images, activez le mode débogage.
    Supervizor_token:
      name: Jeton du superviseur
      description: >-
        Jeton permettant à l'addon de communiquer avec l'API Supervisor.
        Requis pour certaines statistiques matérielles.
