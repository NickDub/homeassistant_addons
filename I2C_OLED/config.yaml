name: "I2C OLED Display"
description: "This addon lets you display to your I2C OLED for a Raspberry Pi with an I2C SSD1306 0.91\" 128x64 OLED."
version: "0.0.2"
slug: "i2c_oled_display"
startup: services
boot: manual
hassio_api: true
init: false
auth_api: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - media:rw
devices:
  - /dev/i2c-0
  - /dev/i2c-1
  - /dev/i2c-2
  - /dev/i2c-3
  - /dev/i2c-4
  - /dev/i2c-5
  - /dev/i2c-6
  - /dev/i2c-7
  - /dev/i2c-8
  - /dev/i2c-9
  - /dev/i2c-10
  - /dev/i2c-11
  - /dev/i2c-12
  - /dev/i2c-13
  - /dev/i2c-14
  - /dev/i2c-15
  - /dev/i2c-16
  - /dev/i2c-17
  - /dev/i2c-18
  - /dev/i2c-19
  - /dev/i2c-20
options:
  Show_Welcome_Screen: false
  Show_Version_Screen: false
  Show_Memory_Screen: true
  Show_Storage_Screen: true
  Show_Network_Screen: true
  Show_CPU_Screen: true
  Show_Static_Screen: false
  Show_Stats_Screen: true

  Welcome_Screen_Duration: 5
  Welcome_Screen_Limit: 2
  Welcome_Screen_Text: "Welcome to {hostname}"

  Version_Screen_Duration: 5
  Version_Screen_Limit: 0

  Memory_Screen_Duration: 5
  Memory_Screen_Limit: 0

  Storage_Screen_Duration: 5
  Storage_Screen_Limit: 0

  Network_Screen_Duration: 5
  Network_Screen_Limit: 0

  CPU_Screen_Duration: 5
  CPU_Screen_Limit: 0

  Static_Screen_Duration: 5
  Static_Screen_Limit: 0
  Static_Screen_Text: "Hassio verion {hassio.os.version} on {hostname} with IP {ip}"
  Static_Screen_Text_NoScroll: false
  Scroll_Amplitude: 6

  Stats_Screen_Duration: 5
  Stats_Screen_Limit: 0

  Graceful_Exit_Text: "Exited at {datetime}"

  Default_Duration: 10
  Temperature_Unit: "C"
  DateTime_Format: "%d/%m/%Y %H:%M:%S"
  Font: "PixelOperator"
  Rotate: 0
  Debug_Mode: false

  I2C_bus: 1

  Supervisor_token: ''

schema:
  Show_Welcome_Screen: bool
  Show_Version_Screen: bool
  Show_Memory_Screen: bool
  Show_Storage_Screen: bool
  Show_Network_Screen: bool
  Show_CPU_Screen: bool
  Show_Static_Screen: bool
  Show_Stats_Screen: bool

  Welcome_Screen_Duration: "int?"
  Welcome_Screen_Limit: "int?"
  Welcome_Screen_Text: "str?"

  Version_Screen_Duration: "int?"
  Version_Screen_Limit: "int?"

  Memory_Screen_Duration: "int?"
  Memory_Screen_Limit: "int?"

  Storage_Screen_Duration: "int?"
  Storage_Screen_Limit: "int?"

  Network_Screen_Duration: "int?"
  Network_Screen_Limit: "int?"

  CPU_Screen_Duration: "int?"
  CPU_Screen_Limit: "int?"

  Static_Screen_Duration: "int?"
  Static_Screen_Limit: "int?"
  Static_Screen_Text: "str?"
  Static_Screen_Text_NoScroll: bool
  Scroll_Amplitude: "int?"

  Stats_Screen_Duration: "int?"
  Stats_Screen_Limit: "int?"

  Graceful_Exit_Text: "str?"
 
  Default_Duration: int
  Temperature_Unit: "list(C|F)?"
  DateTime_Format: "str?"
  Font: "list(DotMatrix|PixelOperator)?"
  Rotate: "int?"
  Debug_Mode: bool

  I2C_bus: "int(0,20)"

  Supervisor_token: "str?"
